AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The builder: what every heavy job's throw-away EC2 instances share, for the OO-1 and other projects
  (tools/aws/README.md). A private, encrypted bucket (each project under its own prefix: PROJECT/src,
  PROJECT/runs, PROJECT/fixtures), its key, and the builder role the `builder` CLI profile assumes for
  day-to-day runs. A project's own instance role, launch template and image repository are its own stack
  (builder-PROJECT), made with the admin profile, as this one is.

Parameters:
  Operator:
    Type: String
    Description: The IAM user that may assume the builder role (its ARN).
  BudgetUsd:
    Type: Number
    Default: 100
    Description: The builder's monthly budget in USD (what is tagged builder=true).
  BudgetEmail:
    Type: String
    Description: Where the budget's alerts go.

Resources:
  Key:
    Type: AWS::KMS::Key
    Properties:
      Description: builder bucket's key
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: TheAccountsIamPoliciesDecide
            Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"
      Tags: [{ Key: builder, Value: "true" }]

  KeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/builder
      TargetKeyId: !Ref Key

  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain # its fixtures and logs outlive a mistaken delete; empty it by hand to remove it
    Properties:
      BucketName: !Sub "builder-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms, KMSMasterKeyID: !GetAtt Key.Arn }
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      LifecycleConfiguration:
        Rules:
          - { Id: runs-30-days, Status: Enabled, Prefix: "", TagFilters: [{ Key: kind, Value: run }], ExpirationInDays: 30 }
          - { Id: sources-7-days, Status: Enabled, TagFilters: [{ Key: kind, Value: src }], ExpirationInDays: 7 }
          - { Id: incomplete-uploads, Status: Enabled, AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 } }
      Tags: [{ Key: builder, Value: "true" }]

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt Bucket.Arn, !Sub "${Bucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # The `builder` profile's role: run jobs, not change the infrastructure.
  BuilderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: builder
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref Operator }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: builder-runs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Bucket
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt Bucket.Arn
              - Sid: Objects
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:PutObjectTagging, s3:GetObjectTagging, s3:AbortMultipartUpload]
                Resource: !Sub "${Bucket.Arn}/*"
              - Sid: TheBucketsKey
                Effect: Allow
                Action: [kms:Encrypt, kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt Key.Arn
              - Sid: LookAround
                Effect: Allow
                Action: [ec2:Describe*, pricing:GetProducts, cloudformation:DescribeStacks, cloudformation:ListStackResources, ssm:GetParameter, ssm:GetParameters]
                Resource: "*"
              - Sid: LaunchFromABuilderTemplateOnly
                Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  ArnLike: { "ec2:LaunchTemplate": !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/*" }
                  StringEquals: { "aws:RequestTag/builder": "true" }
              - Sid: LaunchTheRest
                Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/*"
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*"
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:spot-instances-request/*"
                  - !Sub "arn:aws:ec2:${AWS::Region}::image/*"
              - Sid: TagAtLaunch
                Effect: Allow
                Action: ec2:CreateTags
                Resource: "*"
                Condition: { StringEquals: { "ec2:CreateAction": RunInstances } }
              - Sid: EndOnlyBuildersInstances
                Effect: Allow
                Action: [ec2:TerminateInstances, ec2:StopInstances]
                Resource: "*"
                Condition: { StringEquals: { "aws:ResourceTag/builder": "true" } }
              - Sid: PassOnlyBuilderInstanceRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/builder/*"
                Condition: { StringEquals: { "iam:PassedToService": ec2.amazonaws.com } }
              - Sid: Images
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: ImagesInBuilderRepositories
                Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:InitiateLayerUpload,
                         ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage, ecr:DescribeImages, ecr:DescribeRepositories]
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/builder/*"
      Tags: [{ Key: builder, Value: "true" }]

  # What is tagged builder=true, by month: mail at 80% spent and when the month is forecast past 100%. The
  # tag must be active as a cost allocation tag (Billing, "Cost allocation tags") for the filter to see it.
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: builder-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref BudgetUsd, Unit: USD }
        CostFilters: { TagKeyValue: ["user:builder$true"] }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]

Outputs:
  BucketName: { Value: !Ref Bucket, Export: { Name: builder-bucket } }
  KeyArn: { Value: !GetAtt Key.Arn, Export: { Name: builder-key } }
  BuilderRoleArn: { Value: !GetAtt BuilderRole.Arn }
