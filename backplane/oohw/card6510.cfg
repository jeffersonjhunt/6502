# The diagnostics' 6510 program (card6510.s): its code at $0200-$05FF in the sound
# card's RAM, its zero page from $02 ($00 and $01 are the 6510's port).
MEMORY {
    ZP:  start = $02, size = $1E, type = rw, file = "";
    RAM: start = $0200, size = $0400, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    CODE:     load = RAM, type = ro;
}
