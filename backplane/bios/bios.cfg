# The whole 512 KB of ROM A, as a programmer writes it to the SST39SF040.
# The BIOS is its top block (31, $7C000-$7FFFF), which the north bridge maps
# at CPU $C000-$FFFF at reset; the first 2 KB of that block is hidden by the
# I/O hole, so code starts at $C800. The font is the first 4 KB of block 30
# ($78000) and the video demo is block 29 ($74000), both seen through W1
# ($4000). Blocks 24-28 ($60000-$73FFF) are the boot splash's samples, the
# first 80 KB of the sound card's wave RAM as an image (splash.s copies it in
# on revision 2).
# Blocks 21-23 ($54000-$5FFFF) are the ROM's diagnostics (hw/diag.md, plan 2),
# each seen at $8000 through W2: block 23 the core (diag23.s: the prompt,
# stages 0-6, the library's ROM build), 22 and 21 the card tests (diag22.s,
# diag21.s). Block 23's last page holds the flash's sums (romsum.py writes
# them after ld65) and its vectors, which VEC points at while the core runs.
# The core's variables are in the first 512 bytes of the RAM block it puts
# in W0 (DZP, DBSS: no file). Everything else is erased flash ($FF).
MEMORY {
    PAD:     start = $0000, size = $54000, type = ro, fill = yes, fillval = $FF, file = %O;
    DIAG21:  start = $8000, size = $4000,  type = ro, fill = yes, fillval = $FF, file = %O;
    DIAG22:  start = $8000, size = $4000,  type = ro, fill = yes, fillval = $FF, file = %O;
    DIAG23:  start = $8000, size = $3F00,  type = ro, fill = yes, fillval = $FF, file = %O;
    D23SUMS: start = $BF00, size = $FA,    type = ro, fill = yes, fillval = $FF, file = %O;
    D23VEC:  start = $BFFA, size = $6,     type = ro, fill = yes, fillval = $FF, file = %O;
    DZP:     start = $0040, size = $C0,    type = rw, file = "";
    DBSS:    start = $0100, size = $80,    type = rw, file = "";
    WAVE:    start = $4000, size = $14000, type = ro, fill = yes, fillval = $FF, file = %O;
    DEMO:    start = $4000, size = $4000,  type = ro, fill = yes, fillval = $FF, file = %O;
    FONT:    start = $4000, size = $1000,  type = ro, fill = yes, fillval = $FF, file = %O;
    PAD2:    start = $0000, size = $3800,  type = ro, fill = yes, fillval = $FF, file = %O;
    ROM:     start = $C800, size = $37FA,  type = ro, fill = yes, fillval = $FF, file = %O;
    VECTORS: start = $FFFA, size = $6,     type = ro, fill = yes, file = %O;
}

SEGMENTS {
    CODE:    load = ROM, type = ro;
    WOZMON:  load = ROM, type = ro;
    VIDEO:   load = ROM, type = ro;
    INPUT:   load = ROM, type = ro;
    APPLE:   load = ROM, type = ro;
    SD:      load = ROM, type = ro;
    SPLASH:  load = ROM, type = ro;
    VECTORS: load = VECTORS, type = ro;
    D21:     load = DIAG21, type = ro;
    D22:     load = DIAG22, type = ro;
    D23:     load = DIAG23, type = ro;
    D23CODE: load = DIAG23, type = ro;
    D23SUMS: load = D23SUMS, type = ro;
    D23VEC:  load = D23VEC, type = ro;
    D23ZP:   load = DZP, type = zp;
    D23BSS:  load = DBSS, type = bss, define = yes;
    FONT:    load = FONT, type = ro;
    DEMO:    load = DEMO, type = ro;
    WAVE:    load = WAVE, type = ro;
}
