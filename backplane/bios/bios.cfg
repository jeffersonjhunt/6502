# The whole 512 KB of ROM A, as a programmer writes it to the SST39SF040.
# The BIOS is its top block (31, $7C000-$7FFFF), which the north bridge maps
# at CPU $C000-$FFFF at reset; the first 2 KB of that block is hidden by the
# I/O hole, so code starts at $C800. The font is the first 4 KB of block 30
# ($78000) and the video demo is block 29 ($74000), both seen through W1
# ($4000). Everything else is erased flash ($FF).
MEMORY {
    PAD:     start = $0000, size = $74000, type = ro, fill = yes, fillval = $FF, file = %O;
    DEMO:    start = $4000, size = $4000,  type = ro, fill = yes, fillval = $FF, file = %O;
    FONT:    start = $4000, size = $1000,  type = ro, fill = yes, fillval = $FF, file = %O;
    PAD2:    start = $0000, size = $3800,  type = ro, fill = yes, fillval = $FF, file = %O;
    ROM:     start = $C800, size = $37FA,  type = ro, fill = yes, fillval = $FF, file = %O;
    VECTORS: start = $FFFA, size = $6,     type = ro, fill = yes, file = %O;
}

SEGMENTS {
    CODE:    load = ROM, type = ro;
    WOZMON:  load = ROM, type = ro;
    VIDEO:   load = ROM, type = ro;
    INPUT:   load = ROM, type = ro;
    APPLE:   load = ROM, type = ro;
    VECTORS: load = VECTORS, type = ro;
    FONT:    load = FONT, type = ro;
    DEMO:    load = DEMO, type = ro;
}
