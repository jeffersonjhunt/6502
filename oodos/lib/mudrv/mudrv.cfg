# OOLIB's music driver (mudrv.s) for the sound card's 6510: its code at $1000
# in the card's RAM, its zero page from $10.
MEMORY {
    ZP:  start = $10, size = $F0, type = rw, file = "";
    RAM: start = $1000, size = $1000, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    CODE:     load = RAM, type = ro;
}
