# The test OODOS.SYS (testsys.s): its header record, then each segment from
# a record of its own, padded to the next, in the header's order. Two cross
# the boundaries that matter to CP/M: S5 a logical extent's (record 128),
# S6 a directory entry's on oodos-8m (record 256). ld65 gives each area's offset in the file
# (__NAME_FILEOFFS__), which the header turns into records.
MEMORY {
    HDR: start = $0000, size = $0080, file = %O, fill = yes;
    S1:  start = $0000, size = $0400, file = %O, fill = yes, define = yes; # records 1-8
    S2:  start = $0000, size = $0800, file = %O, fill = yes, define = yes; # 9-24
    S3:  start = $C800, size = $0200, file = %O, fill = yes, define = yes; # 25-28: the cold boot, block 62
    S4:  start = $FFFA, size = $0006, file = %O, fill = yes, define = yes; # 29: the vectors...
    PAD: start = $0000, size = $007A, file = %O, fill = yes;               # ...and the rest of the record
    S5:  start = $0000, size = $3700, file = %O, fill = yes, define = yes; # 30-139
    S6:  start = $0000, size = $4000, file = %O, fill = yes, define = yes; # 140-267
}
SEGMENTS {
    HEADER:  load = HDR, type = ro;
    SEG1:    load = S1,  type = ro, define = yes;
    SEG2:    load = S2,  type = ro, define = yes;
    COLD:    load = S3,  type = ro, define = yes;
    VECTORS: load = S4,  type = ro, define = yes;
    SEG5:    load = S5,  type = ro, define = yes;
    SEG6:    load = S6,  type = ro, define = yes;
}
