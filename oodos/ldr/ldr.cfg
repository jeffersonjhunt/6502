# OOLDR, /BOOT.BIN: loaded at $1000 by the BIOS's C80CR. Code, data and BSS
# all stay below $4000, in W0 (block 0), so W1 and W2 are free to look at
# the segments' blocks while it loads them. BSS isn't in the file. Zero page
# $00-$1F is OOLDR's and the CP/M reader's (CRZP); the BIOS keeps $E0-$E7
# (ECHO) and the monitor $24-$2B.
MEMORY {
    ZP:  start = $0000, size = $0020, type = rw;
    RAM: start = $1000, size = $3000, type = rw, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    CRZP:     load = ZP,  type = zp;
    CODE:     load = RAM, type = ro;
    RODATA:   load = RAM, type = ro;
    BSS:      load = RAM, type = bss;
    CRBSS:    load = RAM, type = bss;
}
