# UITEST's links (test_oodos_ui; U2): a .COM whose code is at $8000, above
# W1, and whose tables, data and BSS are below $4000, so that a program
# with most of OOUI and OOLIB's graphics keeps out of $4000-$7FFF (the W1
# contract): a jump at $0300 (STARTUP), RODATA, DATA and BSS from $0303,
# the gap to $8000 filled, then CODE. The image runs to CODE's end, which
# the program's own header says (uitest.s: OODOS_HEADER's BSS follows the
# image, and here it is inside it, zeros in the file). tools/w1.py checks
# it as it checks every OOUI program.
SYMBOLS {
    __OODOS_FLAGS__: type = export, value = $00;
}
MEMORY {
    HDR: start = $0000, size = $0010, file = %O, fill = yes;
    ZP:  start = $0000, size = $00F0, type = rw, define = yes;
    TPA: start = $0300, size = $BCFD, type = rw, file = %O, fill = yes, define = yes;
}
SEGMENTS {
    HEADER:   load = HDR, type = ro;
    ZEROPAGE: load = ZP,  type = zp, define = yes;
    STARTUP:  load = TPA, type = ro;
    RODATA:   load = TPA, type = ro;
    DATA:     load = TPA, type = rw;
    BSS:      load = TPA, type = rw, define = yes;
    CODE:     load = TPA, type = ro, start = $8000, define = yes;
}
