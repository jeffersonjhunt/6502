# UITEST's links (test_oodos_ui; U2): test-only, not a way to link a
# program (hw/ooui.md, "U2"). OOUI and OOLIB's graphics are more than W1
# leaves a .COM below $4000, so this link puts their code at $8000-$BFFC,
# above W1, and the test's own code (LOWCODE), RODATA, DATA and BSS from
# $0303 below the test's buffers at $1C00 (BIGWORK) and $3000 (AREA): a
# jump at $0300 (STARTUP), then those, then the gap to $8000 filled with
# zeros, then CODE. The image is the whole 47 KB to CODE's end, which uitest.s's own
# header says, its BSS inside it (zeros in the file) rather than after it.
# A real program can't do this: OODOS_HEADER's image is one block from
# $0300, its BSS after it, and a .COM that big leaves no room for its own
# data; OOUI for programs is to be a banked library on the shared FARCALL
# block (U3a, the owner's decision). tools/w1.py checks this link as it
# checks every OOUI program: nothing in $4000-$7FFF.
SYMBOLS {
    __OODOS_FLAGS__: type = export, value = $00;
}
MEMORY {
    HDR: start = $0000, size = $0010, file = %O, fill = yes;
    ZP:  start = $0000, size = $00F0, type = rw, define = yes;
    TPA: start = $0300, size = $1900, type = rw, file = %O, fill = yes, define = yes; # to BIGWORK ($1C00)
    GAP: start = $1C00, size = $1400, type = rw, file = %O, fill = yes;               # BIGWORK, to AREA
    HI:  start = $3000, size = $8FFD, type = rw, file = %O, fill = yes, define = yes; # to $BFFC
}
SEGMENTS {
    HEADER:   load = HDR, type = ro;
    ZEROPAGE: load = ZP,  type = zp, define = yes;
    STARTUP:  load = TPA, type = ro;
    LOWCODE:  load = TPA, type = ro;
    RODATA:   load = TPA, type = ro;
    DATA:     load = TPA, type = rw;
    BSS:      load = TPA, type = rw, define = yes;
    CODE:     load = HI,  type = ro, start = $8000, define = yes;
}
