# UITMIS's link (test/ui/uitmis.s): as uiprog.cfg, but UISTATE at $8001, one
# byte off a page, for ui_load's own refusal (UX_STATE; U3a, E2). Not a way to
# link a program: a normal link refuses it (uiprog/uistate.s's check).
SYMBOLS {
    __OODOS_FLAGS__: type = export, value = $00;
}
MEMORY {
    HDR:  start = $0000, size = $0010, file = %O, fill = yes;
    ZP:   start = $0000, size = $00F0, type = rw, define = yes;
    TPA:  start = $0300, size = $7D00, type = rw, file = %O, define = yes; # to $7FFF (the UI state's after)
    UIS:  start = $8001, size = $0600, type = rw, define = yes;
}
SEGMENTS {
    HEADER:   load = HDR, type = ro;
    ZEROPAGE: load = ZP,  type = zp, define = yes;
    CODE:     load = TPA, type = ro;
    RODATA:   load = TPA, type = ro;
    DATA:     load = TPA, type = rw;
    BSS:      load = TPA, type = bss, define = yes;
    UISTATE:  load = UIS, type = bss, define = yes, optional = yes;
}
