# OOUI's test programs' link (test_oodos_ui; hw/ooui.md, "U3a: OOUI as a banked
# library"): an ordinary .COM, as cfg/com.cfg links one, with OOUI's UISTATE in
# a memory area of its own at $8000, on a page and outside $4000-$7FFF (the W1
# contract), so it costs no padding. A program that uses OOUI adds such an area
# to its own config; com.cfg has none. The area is BSS only: not in the file,
# and ui_load zeroes it.
SYMBOLS {
    __OODOS_FLAGS__: type = export, value = $00;
}
MEMORY {
    HDR:  start = $0000, size = $0010, file = %O, fill = yes;
    ZP:   start = $0000, size = $00F0, type = rw, define = yes;
    TPA:  start = $0300, size = $7D00, type = rw, file = %O, define = yes; # to $7FFF (the UI state's after)
    UIS:  start = $8000, size = $0600, type = rw, define = yes;
}
SEGMENTS {
    HEADER:   load = HDR, type = ro;
    ZEROPAGE: load = ZP,  type = zp, define = yes;
    CODE:     load = TPA, type = ro;
    RODATA:   load = TPA, type = ro;
    DATA:     load = TPA, type = rw;
    BSS:      load = TPA, type = bss, define = yes;
    UISTATE:  load = UIS, type = bss, define = yes;
}
