# The GW-BASIC spike, linked as an OODOS .COM: code from $0300 (hw/oodos.md,
# "What a program sees"). Each translated module has its own segment so the
# map file (-m) gives its size; the harness is first, so $0300 starts it.
# The test data go above: the program at $6100, the control block at $7FF0
# and the math vectors at $8000.
MEMORY {
    TPA:  start = $0300, size = $5E00, type = rw, file = %O;
}

SEGMENTS {
    HARNESS: load = TPA, type = ro;
    GWMAIN:  load = TPA, type = ro;
    GWEVAL:  load = TPA, type = ro;
    BIMISC:  load = TPA, type = ro;
    MATH1:   load = TPA, type = ro;
    MATH2:   load = TPA, type = ro;
    RUNTIME: load = TPA, type = ro;
    MATH1D:  load = TPA, type = ro;
    GWDATA:  load = TPA, type = rw;
    IBMRES:  load = TPA, type = ro;
    STUBS:   load = TPA, type = ro;
    FARCALL: load = TPA, type = ro;
    BSS:     load = TPA, type = bss, define = yes;
}
