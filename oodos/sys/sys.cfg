# OODOS.SYS (hw/oodos.md, "The system, phase 2"), linked once: each block's
# part is its own file, which mksys.py puts in OODOS.SYS as a segment at its
# physical address (the Makefile names them). One link, so the parts call
# each other by name.
#
#   BDOS    block 60, $4000-$7FFF in the system's view (W1)
#   BIOS    block 61, $8000-$BFFF (W2)
#   RES     block 62, $C800-$F7FF (W3): cold boot and the CCP
#   COMMON  block 62, $F800-$FFFF: the jump table, the stub, FARCALL, the
#           interrupt entries and the vectors, filled to $FFFF
#
# ZP and SYSBSS are the system block's (31, W0 in the BDOS and BIOS), not
# in the file: cold boot clears them. RESBSS follows RES in block 62, not
# in the file either; the CCP clears what it needs. BDOS2 is the BDOS's
# code that doesn't fit block 60, in block 62's code window after RES.
MEMORY {
    ZP:     start = $0000, size = $00F0, type = rw;
    SYS:    start = $0300, size = $0500, type = rw;
    BDOS:   start = $4000, size = $4000, type = rw, file = "%O.bdos";
    BIOS:   start = $8000, size = $4000, type = rw, file = "%O.bios";
    RES:    start = $C800, size = $3000, type = rw, file = "%O.res";
    COMMON: start = $F800, size = $0800, type = rw, file = "%O.common", fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    SYSBSS:   load = SYS,    type = bss;
    BDOS:     load = BDOS,   type = rw;
    BIOS:     load = BIOS,   type = rw;
    RES:      load = RES,    type = rw;
    BDOS2:    load = RES,    type = rw,  optional = yes;
    RESBSS:   load = RES,    type = bss;    # BSS last: ld65 writes no bytes for it, so
                                            # anything after it in the file would move
    JUMPS:    load = COMMON, type = ro, start = $F800;
    COMMON:   load = COMMON, type = rw;
    VECTORS:  load = COMMON, type = ro, start = $FFFA;
}
