# The flat test image (the project's own): GW-BASIC's resident core and its
# blocks assembled with -D FLAT, so a far call is a JSR, and linked as one
# image at $0300 with the math harness first, for check.py on the W65C02S
# core alone (run6502). No OODOS: the header isn't in the file, and the
# loader is linked but never runs. The test data go above the image: a
# program at $9000, the control block at $9FF0, the vectors at $A000
# (check.py checks the image ends below $9000).
SYMBOLS {
    __OODOS_FLAGS__: type = export, value = $00;
}
MEMORY {
    HDR: start = $0000, size = $0010, file = "";
    ZP:  start = $0000, size = $00F0, type = rw, define = yes;
    TPA: start = $0300, size = $8D00, type = rw, file = %O, define = yes;
}
SEGMENTS {
    HEADER:   load = HDR, type = ro;
    ZEROPAGE: load = ZP,  type = zp, define = yes;
    HARNESS:  load = TPA, type = ro;
    STARTUP:  load = TPA, type = ro;
    CODE:     load = TPA, type = ro;
    RODATA:   load = TPA, type = ro;
    DATA:     load = TPA, type = rw;
    LOWRAM:   load = TPA, type = rw, define = yes;
    RAM:      load = TPA, type = rw, define = yes;
    BRAM:     load = TPA, type = rw, define = yes;
    LOADER:   load = TPA, type = ro, define = yes;
    LOADDAT:  load = TPA, type = ro;
    FARFIX:   load = TPA, type = ro, define = yes;
    BSS:      load = TPA, type = bss, define = yes;
}
