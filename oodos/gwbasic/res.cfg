# GW-BASIC's resident core, linked as an OODOS .COM (hw/oodos.md, "The plan,
# phase 7": the memory layout). The image runs from $0300: the code, its
# tables and data, then LOWRAM (what a primitive or an interrupt may touch,
# first in fixed RAM so it stays under $4000: tools/gwsize.py checks it),
# then the rest of fixed RAM, then the loader, which runs once and becomes
# the start of BASIC's workspace. Fixed RAM is in the file (as zeros), so the
# loader can follow it; BSS is empty. FARFIX, the far call sites the loader
# patches, comes after the loader: transient too.
SYMBOLS {
    __OODOS_FLAGS__: type = export, value = $00;
}
MEMORY {
    HDR: start = $0000, size = $0010, file = %O, fill = yes;
    ZP:  start = $0000, size = $00F0, type = rw, define = yes;
    TPA: start = $0300, size = $BCFD, type = rw, file = %O, define = yes; # to $BFFC: $BFFD is the BDOS's JMP
}
SEGMENTS {
    HEADER:   load = HDR, type = ro;
    ZEROPAGE: load = ZP,  type = zp, define = yes;
    STARTUP:  load = TPA, type = ro;
    CODE:     load = TPA, type = ro;
    RODATA:   load = TPA, type = ro;
    DATA:     load = TPA, type = rw;
    LOWRAM:   load = TPA, type = rw, define = yes;
    RAM:      load = TPA, type = rw, define = yes;
    LOADER:   load = TPA, type = ro, define = yes;
    LOADDAT:  load = TPA, type = ro;
    FARFIX:   load = TPA, type = ro, define = yes;
    BSS:      load = TPA, type = bss, define = yes;
}
