# GW-BASIC's home block, P8 (hw/oodos.md, "The plan, phase 7": 7c's home
# block), linked as blk.cfg links a banked block, for W3's code window,
# $C800-$F7FF, but with HOMTAB, the statement table (p8/home.s's STMDSP),
# at $C820 (gwbasic.inc's HOMTAB), right after the header and jump table,
# so the resident statement loop reads it at a fixed address. ld65 refuses
# a header that would overrun it.
MEMORY {
    BLK: start = $C800, size = $3000, type = rw, file = %O;
}
SEGMENTS {
    BLKHDR:  load = BLK, type = ro, start = $C800;
    HOMTAB:  load = BLK, type = ro, start = $C820;
    CODE:    load = BLK, type = ro;
    RODATA:  load = BLK, type = ro;
    DATA:    load = BLK, type = rw;
    BRAM:    load = BLK, type = rw, define = yes;
    FARFIX:  load = BLK, type = ro, define = yes;
}
