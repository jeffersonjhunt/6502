# A banked block of GW-BASIC's, P1-P8 (hw/oodos.md, "The plan, phase 7"),
# linked for W3's code window, $C800-$F7FF: its header and jump table
# (BLKHDR, made by tools/gwgen.py), its code and data, BRAM (the block's own
# variables, in the image as zeros), and FARFIX, its far call sites, which
# the loader patches before the block goes to its memory. Common memory,
# $F800-$FFFF, isn't in the image: the loader copies it in from the running
# OODOS. No zero page of its own: the resident core's (gwbasic.inc).
MEMORY {
    BLK: start = $C800, size = $3000, type = rw, file = %O;
}
SEGMENTS {
    BLKHDR:  load = BLK, type = ro, start = $C800;
    CODE:    load = BLK, type = ro;
    RODATA:  load = BLK, type = ro;
    DATA:    load = BLK, type = rw;
    BRAM:    load = BLK, type = rw, define = yes;
    FARFIX:  load = BLK, type = ro, define = yes;
}
