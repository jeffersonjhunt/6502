# A C program as an OODOS .COM (Plan C1; the Programmer's Guide, appendix F,
# "A program in C"): com.cfg's file and memory, with cc65's segments. STARTUP
# is c/crt0.s's and comes first, so the image starts at $0300 with it. ONCE
# holds code run once, before main (the constructors: the heap's floor, argc
# and argv). The constructor and destructor tables go in RODATA, so every
# code segment holds code only and goes through the rules gate. The C stack
# runs down from the top of the TPA; the heap runs up from the end of BSS to
# __STACKSIZE__ below the stack's start.
SYMBOLS {
    __OODOS_FLAGS__: type = export, value = $00;
    __STACKSIZE__:   type = weak,   value = $0800;
}
MEMORY {
    HDR: start = $0000, size = $0010, file = %O, fill = yes;
    ZP:  start = $0000, size = $00F0, type = rw, define = yes;
    TPA: start = $0300, size = $BCFD, type = rw, file = %O, define = yes; # to $BFFC: $BFFD is the BDOS's JMP
}
SEGMENTS {
    HEADER:   load = HDR, type = ro;
    ZEROPAGE: load = ZP,  type = zp, define = yes;
    STARTUP:  load = TPA, type = ro;
    ONCE:     load = TPA, type = ro, optional = yes;
    CODE:     load = TPA, type = ro;
    RODATA:   load = TPA, type = ro;
    DATA:     load = TPA, type = rw;
    BSS:      load = TPA, type = bss, define = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}
