# An OODOS RSX (hw/oodos.md, "The RSXs, phase 5"): a .PRL, as prl.cfg, but
# flagged an RSX too ($03), its image starting with the 27-byte prefix
# (RSX_PREFIX, include/oodos.inc, in the RSXHDR segment). mkprl.py makes the
# .RSX from three links, as for a .PRL:
#
#   ld65 -C rsx.cfg rsx.o -o rsx.a -m rsx.a.map
#   ld65 -C rsx.cfg -D __OODOS_PAGE__=4 -D __OODOS_ZP__=2 rsx.o -o rsx.b
#   ld65 -C rsx.cfg -D __OODOS_PAGE__=5 -D __OODOS_ZP__=5 rsx.o -o rsx.c
#
# Its zero page, at most 16 bytes, is moved by the loader into what is free
# of $F0-$FF. BSS only, as for any program.
SYMBOLS {
    __OODOS_FLAGS__: type = export, value = $03;
    __OODOS_PAGE__:  type = weak,   value = $03;
    __OODOS_ZP__:    type = weak,   value = $00;
}
MEMORY {
    HDR: start = $0000, size = $0010, file = %O, fill = yes;
    ZP:  start = __OODOS_ZP__, size = $0010, type = rw, define = yes;
    TPA: start = __OODOS_PAGE__ * $100, size = $C000 - __OODOS_PAGE__ * $100, type = rw, file = %O, define = yes;
}
SEGMENTS {
    HEADER:   load = HDR, type = ro;
    ZEROPAGE: load = ZP,  type = zp, define = yes;
    RSXHDR:   load = TPA, type = rw;
    CODE:     load = TPA, type = ro;
    RODATA:   load = TPA, type = ro;
    DATA:     load = TPA, type = rw;
    BSS:      load = TPA, type = bss, define = yes;
}
