# OOUI's banked library, OOUI.BNK (hw/ooui.md, "U3a: OOUI as a banked library"): one link of every
# module, made three times by tools/mkbank.py with the values below moved (L0, L1, L2) and compared.
# UICOM, the part every block holds, is at $C800; the three blocks' own parts all start after it, at the
# same address, each its own memory area and file (A: the core and the menus, B: the widgets, C: the
# dialogs), so each block has $C800-$F7FF in W3. OOUI's shared variables (UISTATE, in the program's
# memory) are VARS, at __UIS__ (a page); its zero page (the program's) is ZP, at __UIZ__. The OOLIB
# routines and variables, FARCALL and the blocks' numbers are -D values: mkbank.py's imports.
SYMBOLS {
    __UIS__:     type = weak, value = $1000;
    __UIZ__:     type = weak, value = $10;
    __UCOMSZ__:  type = weak, value = $0C00;
    __BLKSZ__:   type = weak, value = $3000 - __UCOMSZ__;
}
MEMORY {
    ZP:   start = __UIZ__, size = $00F0 - __UIZ__, type = rw, define = yes;
    VARS: start = __UIS__, size = $0600, type = rw, define = yes;
    U:    start = $C800, size = __UCOMSZ__, type = rw, file = "ucom.bin", define = yes;
    A:    start = $C800 + __UCOMSZ__, size = __BLKSZ__, type = rw, file = "a.bin", define = yes;
    B:    start = $C800 + __UCOMSZ__, size = __BLKSZ__, type = rw, file = "b.bin", define = yes;
    C:    start = $C800 + __UCOMSZ__, size = __BLKSZ__, type = rw, file = "c.bin", define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp,  define = yes;
    UIHEAD:   load = VARS, type = bss, define = yes;
    BSS:      load = VARS, type = bss, define = yes;
    UCODE:    load = U,    type = ro,  define = yes;
    URODATA:  load = U,    type = ro,  define = yes;
    AENTRY:   load = A,    type = ro,  define = yes;
    CODE:     load = A,    type = ro,  define = yes;
    RODATA:   load = A,    type = ro,  define = yes;
    BENTRY:   load = B,    type = ro,  define = yes;
    BCODE:    load = B,    type = ro,  define = yes;
    BRODATA:  load = B,    type = ro,  define = yes;
    BBSS:     load = B,    type = bss, define = yes, optional = yes;
    CENTRY:   load = C,    type = ro,  define = yes;
    CCODE:    load = C,    type = ro,  define = yes;
    CRODATA:  load = C,    type = ro,  define = yes;
    CBSS:     load = C,    type = bss, define = yes, optional = yes;
}
