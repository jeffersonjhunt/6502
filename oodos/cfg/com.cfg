# An OODOS .COM (hw/oodos.md, "RSXs and programs"): the 16-byte header
# (OODOS_HEADER, include/oodos.inc), then the image, linked to run at $0300.
# The header is in the file only; the loader puts the image at $0300. BSS
# follows the image in memory but not in the file. The zero page segment is
# the program's own, from $00 ($00-$EF are the program's).
SYMBOLS {
    __OODOS_FLAGS__: type = export, value = $00;
}
MEMORY {
    HDR: start = $0000, size = $0010, file = %O, fill = yes;
    ZP:  start = $0000, size = $00F0, type = rw, define = yes;
    TPA: start = $0300, size = $BD00, type = rw, file = %O, define = yes;
}
SEGMENTS {
    HEADER:   load = HDR, type = ro;
    ZEROPAGE: load = ZP,  type = zp, define = yes;
    CODE:     load = TPA, type = ro;
    RODATA:   load = TPA, type = ro;
    DATA:     load = TPA, type = rw;
    BSS:      load = TPA, type = bss, define = yes;
}
