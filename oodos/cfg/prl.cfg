# An OODOS .PRL's link (hw/oodos.md, "RSXs and programs"): as com.cfg, but
# flagged relocatable, at the page __OODOS_PAGE__ and with the zero page
# segment from __OODOS_ZP__. mkprl.py makes the .PRL from two links of the
# same objects, a page apart and a zero page offset apart:
#
#   ld65 -C prl.cfg prog.o -o prog.a                     # $0300, ZP $00
#   ld65 -C prl.cfg -D __OODOS_PAGE__=4 -D __OODOS_ZP__=2 prog.o -o prog.b
SYMBOLS {
    __OODOS_FLAGS__: type = export, value = $01;
    __OODOS_PAGE__:  type = weak,   value = $03;
    __OODOS_ZP__:    type = weak,   value = $00;
}
MEMORY {
    HDR: start = $0000, size = $0010, file = %O, fill = yes;
    ZP:  start = __OODOS_ZP__, size = $0100 - __OODOS_ZP__, type = rw, define = yes;
    TPA: start = __OODOS_PAGE__ * $100, size = $C000 - __OODOS_PAGE__ * $100, type = rw, file = %O, define = yes;
}
SEGMENTS {
    HEADER:   load = HDR, type = ro;
    ZEROPAGE: load = ZP,  type = zp, define = yes;
    CODE:     load = TPA, type = ro;
    RODATA:   load = TPA, type = ro;
    DATA:     load = TPA, type = rw;
    BSS:      load = TPA, type = bss, define = yes;
}
