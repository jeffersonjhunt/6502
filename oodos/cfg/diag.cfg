# DIAG.COM (utils/diag.s; hw/diag.md, "DIAG.COM"): a .COM as com.cfg's, its image at $0300, but laid out
# around the W1 contract's window, for it is more than the 15 KB below it. Its code is in $0300-$3FFF
# (CODE) and from $8000 (CODE2, which the rules gate checks too); $4000-$7FFF, W1's window, which OOLIB
# maps elsewhere, holds nothing of DIAG's (zeros in the file, so the image runs on past it); its data and
# BSS follow CODE2, to $ABFF, and its buffers are from $AC00 to $BFFC (diag.s's SCR). M1 tests
# $4000-$7FFF and what is past the BSS. w1.py holds that no segment is in W1's window; ld65 holds each
# part to its room.
SYMBOLS {
    __OODOS_FLAGS__: type = export, value = $00;
}
MEMORY {
    HDR: start = $0000, size = $0010, file = %O, fill = yes;
    ZP:  start = $0000, size = $00F0, type = rw, define = yes;
    TPA: start = $0300, size = $3D00, type = rw, file = %O, fill = yes, define = yes;
    W1:  start = $4000, size = $4000, type = rw, file = %O, fill = yes;
    HI:  start = $8000, size = $2C00, type = rw, file = %O, define = yes;
}
SEGMENTS {
    HEADER:   load = HDR, type = ro;
    ZEROPAGE: load = ZP,  type = zp, define = yes;
    CODE:     load = TPA, type = ro;
    CODE2:    load = HI,  type = ro;
    DATA:     load = HI,  type = rw;
    RODATA:   load = HI,  type = ro;
    BSS:      load = HI,  type = bss, define = yes;
}
